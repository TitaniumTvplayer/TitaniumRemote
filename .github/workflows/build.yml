name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source
        run: |
          mkdir -p src
          unzip -q -o TitaniumRemote_v2_3_source.zip -d src
          ls src
          ls src/app/src/main/java/com/titanium/remote
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: src
      - name: Relax JVM target check
        run: printf '\nkotlin.jvm.target.validation.mode=warning\n' >> src/gradle.properties
      - name: Build release + debug APK
        working-directory: src
        run: gradle assembleRelease assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TitaniumRemote-APK
          path: |
            src/app/build/outputs/apk/release/app-release.apk
            src/app/build/outputs/apk/debug/app-debug.apk
