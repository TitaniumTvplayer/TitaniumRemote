name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q TitaniumRemote_with_cloud_build.zip -d proj
      - name: Fix source and JVM target
        run: |
          sed -i 's/^n        }$/        }/' proj/app/src/main/java/com/titanium/remote/MainActivity.kt
          cat >> proj/app/build.gradle <<'EOF'
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon -p proj
      - uses: actions/upload-artifact@v4
        with:
          name: TitaniumRemote-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
