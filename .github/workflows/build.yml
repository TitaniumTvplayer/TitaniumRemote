name: Build APK
on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Unpacks EVERY zip in the repo, oldest first: the full project first, then each patch on top of it.
      - name: Unpack all zips in order (full project, then patches)
        run: |
          mkdir -p src
          git log --diff-filter=AM --name-only --reverse --pretty=format: -- '*.zip' \
            | awk 'NF && !seen[$0]++' | while read -r f; do
              [ -f "$f" ] || continue
              echo "Applying: $f"
              t=$(mktemp -d)
              unzip -q -o "$f" -d "$t"
              if [ ! -d "$t/app" ]; then
                d=$(find "$t" -mindepth 1 -maxdepth 1 -type d | head -n1)
                [ -n "$d" ] && t="$d"
              fi
              cp -a "$t"/. src/
            done
          if [ ! -f src/settings.gradle ] && [ ! -f src/settings.gradle.kts ]; then
            echo "ERROR: no full Android project found. Upload the full project zip (the one containing settings.gradle and app/) once, then patches on top."
            ls -R src | head -50
            exit 1
          fi
          ls src

      # Text recognition (import server details from an image) needs this library.
      - name: Add text-recognition dependency
        run: |
          python3 - <<'PY'
          import re, os
          dep = "com.google.android.gms:play-services-mlkit-text-recognition:19.0.1"
          for name in ("src/app/build.gradle", "src/app/build.gradle.kts"):
              if not os.path.exists(name):
                  continue
              s = open(name, encoding="utf-8").read()
              if "play-services-mlkit-text-recognition" in s:
                  print("already present in", name)
                  break
              line = ('    implementation("%s")' if name.endswith(".kts") else "    implementation '%s'") % dep
              s2, n = re.subn(r"(?m)^dependencies\s*\{", lambda m: m.group(0) + "\n" + line, s, count=1)
              if n == 0:
                  raise SystemExit("no dependencies { block found in " + name)
              open(name, "w", encoding="utf-8").write(s2)
              print("added to", name)
              break
          else:
              raise SystemExit("app/build.gradle not found")
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: src

      - name: Relax JVM target check
        run: |
          echo "" >> src/gradle.properties
          echo "kotlin.jvm.target.validation.mode=warning" >> src/gradle.properties

      - name: Build release + debug APK
        working-directory: src
        run: gradle assembleRelease assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TitaniumRemote-APK
          path: |
            src/app/build/outputs/apk/release/app-release.apk
            src/app/build/outputs/apk/debug/app-debug.apk
